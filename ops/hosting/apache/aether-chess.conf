<VirtualHost *:80>
    ServerName aetherchess.invalid
    DocumentRoot /srv/aether-chess/current/client

    <Directory /srv/aether-chess/current/client>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3100/api retry=0 timeout=30
    ProxyPassReverse /api http://127.0.0.1:3100/api

    Alias /healthz /srv/aether-chess/shared/healthz.txt
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/aether-chess-error.log
    CustomLog ${APACHE_LOG_DIR}/aether-chess-access.log combined
</VirtualHost>

