<VirtualHost *:80>
    ServerName aether.completeelectronics.net

    ProxyPreserveHost On
    ProxyPass /healthz !
    Alias /healthz /srv/aether-chess/shared/healthz.txt
    <Directory /srv/aether-chess/shared>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass / http://127.0.0.1:3100/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3100/

    RequestHeader set X-Forwarded-Proto "http"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/aether-chess-error.log
    CustomLog ${APACHE_LOG_DIR}/aether-chess-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName aether.completeelectronics.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/completeelectronics.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/completeelectronics.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyPass /healthz !
    Alias /healthz /srv/aether-chess/shared/healthz.txt
    <Directory /srv/aether-chess/shared>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass / http://127.0.0.1:3100/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3100/

    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/aether-chess-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/aether-chess-ssl-access.log combined
</VirtualHost>
</IfModule>
